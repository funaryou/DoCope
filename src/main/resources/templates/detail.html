<!DOCTYPE html>
<html lang="jp" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${document.name} + ' - Documents Bridge'">詳細</title>
</head>
<body>
    <a href="/">← 一覧に戻る</a>
    <a th:href="@{/edit/{id}(id=${document.id})}">編集</a>
    <a th:href="@{/workspace/{id}(id=${document.id})}">閲覧</a>

    <h1 th:text="${document.name}">プロジェクト名</h1>

    <div>
        <p><strong>パス：</strong><span th:text="${document.path}">パス</span></p>
        <p><strong>登録日：</strong><span th:text="${document.createdAt}">日付</span></p>
        <p><strong>更新日：</strong><span th:text="${document.updatedAt}">日付</span></p>
        <p><strong>メモ：</strong><span th:text="${document.description}">メモ</span></p>
    </div>

    <hr>

    <div th:if="${document.icon}">
        <img th:src="@{/{icon}(icon=${document.icon})}" alt="icon" width="64" height="64">
    </div>

    <form th:action="@{/delete/{id}(id=${document.id})}" method="post"
          onsubmit="return confirm('削除しますか？関連アイコンも削除されます');">
        <button type="submit">削除</button>
    </form>

    <hr>

    <h2>ファイル内容</h2>
    <pre th:text="${filePath}" style="white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 4px;">ファイル内容</pre>
</body>
</html>
