<!DOCTYPE html>
<html lang="jp" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${document.projectName} + ' - Documents Bridge'">詳細</title>
</head>
<body>
    <a href="/">← 一覧に戻る</a>

    <h1 th:text="${document.projectName}">プロジェクト名</h1>

    <div>
        <p><strong>パス：</strong><span th:text="${document.path}">パス</span></p>
        <p><strong>登録日：</strong><span th:text="${document.createdAt}">日付</span></p>
        <p><strong>更新日：</strong><span th:text="${document.updatedAt}">日付</span></p>
        <p><strong>メモ：</strong><span th:text="${document.description}">メモ</span></p>
    </div>

    <hr>

    <h2>ファイル内容</h2>
    <pre th:text="${fileContent}" style="white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 4px;">ファイル内容</pre>
</body>
</html>
