<!DOCTYPE html>
<html lang="jp" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Bridge</title>
</head>
<body>
    <h1>Documents Bridge</h1>

    <h2>新規登録</h2>
    <form th:action="@{/register}" method="post" enctype="multipart/form-data">
        <input type="text" name="name" required>
        <label for="name">name</label>
        <input type="text" name="path" required>
        <label for="path">path</label>
        <input type="text" name="description">
        <label for="description">description</label>
        <input type="color" name="color" value="#fff1e6">
        <input type="file" name="iconFile" accept="image/*">
        <p th:if="${iconError}" th:text="${iconError}"></p>
        <p th:if="${#fields.hasErrors('documentItem.name')}" th:errors="*{documentItem.name}"></p>
        <button type="submit">登録</button>
    </form>

    <h2>登録一覧</h2>
    <table>
        <thead>
            <tr>
                <th>アイコン</th>
                <th>プロジェクト名</th>
                <th>パス</th>
                <th>登録日</th>
                <th>更新日</th>
                <th>メモ</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="doc : ${documents}">
                <td>
                    <img th:if="${doc.icon}" th:src="@{/{icon}(icon=${doc.icon})}" alt="icon" width="32" height="32">
                    <span th:unless="${doc.icon}">-</span>
                </td>
                <td th:text="${doc.name}">プロジェクト名</td>
                <td th:text="${doc.path}">パス</td>
                <td th:text="${doc.createdAt}">日付</td>
                <td th:text="${doc.updatedAt}">日付</td>
                <td th:text="${doc.description}">メモ</td>
                <td>
                    <a th:href="@{/detail/{id}(id=${doc.id})}">表示</a>
                    <a th:href="@{/workspace/{id}(id=${doc.id})}">閲覧</a>
                    <a th:href="@{/edit/{id}(id=${doc.id})}">編集</a>
                    <form th:action="@{/delete/{id}(id=${doc.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('削除しますか？関連アイコンも削除されます');">
                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
