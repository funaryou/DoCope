<!DOCTYPE html>
<html lang="jp" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Bridge</title>
</head>
<body>
    <h1>Documents Bridge</h1>

    <h2>新規登録</h2>
    <form th:action="@{/register}" method="post">
        <div>
            <label>プロジェクト名：</label>
            <input type="text" name="projectName" required>
        </div>
        <div>
            <label>パス：</label>
            <input type="text" name="path" required>
        </div>
        <div>
            <label>メモ：</label>
            <input type="text" name="description">
        </div>
        <button type="submit">登録</button>
    </form>

    <h2>登録一覧</h2>
    <table>
        <thead>
            <tr>
                <th>プロジェクト名</th>
                <th>パス</th>
                <th>登録日</th>
                <th>更新日</th>
                <th>メモ</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="doc : ${documents}">
                <td th:text="${doc.projectName}">プロジェクト名</td>
                <td th:text="${doc.path}">パス</td>
                <td th:text="${doc.createdAt}">日付</td>
                <td th:text="${doc.updatedAt}">日付</td>
                <td th:text="${doc.description}">メモ</td>
                <td><a th:href="@{/detail/{id}(id=${doc.id})}">表示</a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
