spring.application.name=do-cope

# テンプレートのキャッシュを切る（ホットリロード）
spring.thymeleaf.cache=false

# SQLite 設定
spring.datasource.url=jdbc:sqlite:data/documents.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# ddl-auto は update（テーブルがなければ作り、あれば維持）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ファイルアップロードのサイズ上限（IconValidatorの判定基準と共有）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

# Bean Validation用（Controllerで @Valid を使うと自動的にチェックが入ります）
# 要 spring-boot-starter-validation
app.icons-dir=data/icons
